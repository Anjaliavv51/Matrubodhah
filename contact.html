<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        .contact-form {
            background: white;
            width: 700px;
            height: 500px;
            padding: 20px;
            margin-left: 450px;
            margin-top: 150px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);

        }
        .contact-form h1 {
            margin-bottom: 20px;
            margin-left: 260px;
            text-shadow: 4px 4px 4px rgba(0, 0, 0, 0.4);
        }
        .contact-form label {
            display: block;
            margin-bottom: 5px;
            margin-left: 15px;
            font-weight: 500;
        }
        .contact-form input
         {
            width: 93%;
            padding: 10px;
            margin-bottom: 15px;
            margin-left: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .contact-form textarea{
            width: 650px;
            height: 150px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-left: 15px;
        }
        .contact-form input:hover{
            border-color: #e5a186;
        }
        .contact-form textarea:hover{
            border-color: #e5a186;
        }
        .contact-form button {
            background-color: #e5a186;
            color: white;
            border: none;
            font-size: 20px;
            width: 200px;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 4px;
            margin-left: 250px;
            transition: all 0.3s ease;
        }
        .contact-form button:hover {
            background-color: #f6a07e;
            text-shadow: 4px 4px 4px rgba(0, 0, 0, 0.4);
        }
    </style>
    
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="animations.css">
    <link rel="stylesheet" href="scontentcss.css">
    <link rel="stylesheet" href="footercss.css">
    <link rel="stylesheet" href="counting.css">
    <link rel="stylesheet" href="terms.css">
    <!-- Font Awesome CDN link --> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <nav>
            <!-- Wrap the logo text in an anchor tag -->
            <a href="#hero" class="logo">मातृबोधः</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#wisdom">About</a></li>
                <li class="dropdown">
                    <a href="#">Content</a>
                    <ul class="dropdown-content">
                        <li><a href="countingpage.html">Counting</a></li>
                        <li><a href="#">Days</a></li>
                        <li><a href="#">Activities</a></li>
                    </ul>
                </li>
                <li><a href="login.html">Login</a></li>
                <li><a href="contact.html" >Contact</a></li>
            </ul>
            <div class="toggle-menu">☰</div>
        </nav>
    </header>
    <div class="contact-form">
        <h1>Contact Us</h1>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Submit</button>
        </form>
    </div>

        </a>

</body>
